<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>회원가입 - 배터리 주문 관리</title>
	<link rel="stylesheet" href="/css/app.css">
</head>
<body class="login-page">
<main class="login-box">
	<h1>회원가입</h1>
	<p class="muted">가입한 계정은 admin 과 같은 권한으로 사용합니다</p>
	<p class="alert error" id="signupError" hidden></p>
	<form id="signupForm" method="post" action="/signup" class="stack">
		<label>아이디 <input type="text" name="username" autofocus required></label>
		<label>비밀번호 <input type="password" name="password" required></label>
		<button type="submit" class="primary">가입</button>
	</form>
	<p class="muted"><a href="/login">로그인으로 돌아가기</a></p>
</main>

<script src="/js/common.js"></script>
<script src="/js/signup.js"></script>
</body>
</html>
