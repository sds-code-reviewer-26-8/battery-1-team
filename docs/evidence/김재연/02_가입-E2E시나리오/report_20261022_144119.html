<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영역 판정 보고서</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --text: #1f2937; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --accent-soft: #dbeafe;
    --ok: #15803d; --ok-soft: #dcfce7; --warn: #b45309; --warn-soft: #fef3c7;
    --bad: #b91c1c; --bad-soft: #fee2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827; --card: #1f2937; --text: #f3f4f6; --muted: #9ca3af; --line: #374151;
      --accent: #60a5fa; --accent-soft: #1e3a5f;
      --ok: #4ade80; --ok-soft: #14532d; --warn: #fbbf24; --warn-soft: #78350f;
      --bad: #f87171; --bad-soft: #7f1d1d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.6;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  header, main { max-width: 900px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 24px; }
  main { padding-bottom: 32px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .step { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex: none; }
  .badge { display: inline-block; padding: 3px 12px; border-radius: 999px; font-weight: 700; font-size: 13px; }
  .badge.PASS, .badge.yes, .badge.GREEN { background: var(--ok-soft); color: var(--ok); }
  .badge.no, .badge.FAIL, .badge.RED { background: var(--bad-soft); color: var(--bad); }
  .badge.warn, .badge.YELLOW { background: var(--warn-soft); color: var(--warn); }
  .meta { color: var(--muted); font-size: 13px; }
  .label { color: var(--muted); font-size: 12px; margin: 12px 0 2px; }
  ul { margin: 4px 0; padding-left: 20px; }
  li { margin-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td.n, th.n { text-align: right; white-space: nowrap; }
  code { font-family: Consolas, "D2Coding", monospace; font-size: 13px; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
  details { margin: 2px 0; }
  summary { cursor: pointer; color: var(--accent); font-size: 13px; }
  .evidence { white-space: pre-wrap; background: var(--bg); border-radius: 8px; padding: 8px 10px; margin-top: 4px; font-size: 13px; }
  .req { white-space: pre-wrap; background: var(--bg); border-radius: 8px; padding: 10px 12px; margin: 8px 0 0; }
  a { color: var(--accent); }
  .none { color: var(--muted); }
  .links a { margin-right: 14px; }

  /* 영역 판정 */
  .zone { border-width: 2px; }
  .zone.GREEN { border-color: var(--ok); }
  .zone.YELLOW { border-color: var(--warn); }
  .zone.RED { border-color: var(--bad); }
  .zone-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .zone-dot { width: 22px; height: 22px; border-radius: 50%; flex: none; }
  .zone-dot.GREEN { background: var(--ok); }
  .zone-dot.YELLOW { background: var(--warn); }
  .zone-dot.RED { background: var(--bad); }
  .zone-name { font-size: 20px; font-weight: 800; }
  .zone-name.GREEN { color: var(--ok); }
  .zone-name.YELLOW { color: var(--warn); }
  .zone-name.RED { color: var(--bad); }
  .zone-summary { font-size: 17px; font-weight: 700; margin: 10px 0 0; }
  .todo { border-radius: 8px; padding: 10px 12px; margin-top: 6px; }
  .todo.GREEN { background: var(--ok-soft); }
  .todo.YELLOW { background: var(--warn-soft); }
  .todo.RED { background: var(--bad-soft); }
  .todo ul { margin: 2px 0; }
  .signals td:first-child { white-space: nowrap; }
  .headline { font-size: 18px; font-weight: 700; margin: 8px 0 0; }
</style>
</head>
<body>
<header>
  <h1>영역 판정 보고서</h1>
  <p class="sub" id="sub">루프의 결과를 Green · Yellow · Red 로 판정한 요약입니다.</p>
</header>
<main id="view"></main>

<script>
// 보고서 한 건. build-report.cjs 가 실행할 때마다 이 자리에 JSON 을 넣어 새 HTML 을 만든다.
var report = {"loop":"ih","id":"20261022_144119","createdAt":"2026-10-22 14:41:19","round":1,"request":"E2E 가입 시나리오 추가해줘.","result":"PASS","headline":"가입 E2E 5건을 추가했고 전체 회귀가 통과했다","triage":{"zone":"YELLOW","summary":"테스트만 추가했지만 인증·권한 동작을 다루고 Gradle 은 UP-TO-DATE 결과를 썼다","reasons":["src/test/e2e/signup.spec.ts 신규 1개, 소스 변경 없음","가입 계정의 admin 동일 권한(/master)을 검증하는 인증 영역 테스트","Gradle test 는 UP-TO-DATE 라 이번에 재실행되지 않음"],"signals":[{"label":"테스트 충분성","level":"GREEN","note":"5건 모두 임시 서버에서 실행 통과"},{"label":"도메인 민감도","level":"YELLOW","note":"인증·권한 시나리오"},{"label":"변경 범위","level":"GREEN","note":"새 파일 1개"}],"actions":["Gradle 테스트를 클린 재실행해 확인"]},"verify":{"points":["가입 spec 5건이 8081 임시 서버에서 통과했다","E2E 전체 50건, Gradle 26건 모두 실패 0건이다","임시 서버는 종료했고 새 spec 외 변경은 없다"],"checklist":[{"title":"가입 후 로그인 흐름 통과","passed":true,"evidence":"signup.spec.ts 5 passed, SIGNUP-01 통과"},{"title":"오류 문구 3종 표시","passed":true,"evidence":"SIGNUP-02/03/04 가 #signupError 문구 단언, 통과"},{"title":"범위 준수와 마스터 접근","passed":true,"evidence":"git status 새 spec 만, SIGNUP-05 /master 헤딩 확인 통과"}],"criteria":[{"criterion":"signup.spec.ts 전체 통과 및 고유 아이디, 범위 준수","passed":true,"evidence":"5건 통과, uniqueName 사용, 새 spec 외 변경 없음"}],"regression":[{"name":"Gradle 테스트","command":"./gradlew.bat test","total":26,"passed":26,"failed":0,"skipped":0},{"name":"Playwright E2E","command":"BASE_URL=http://localhost:8081 npx playwright test","total":50,"passed":50,"failed":0,"skipped":0}],"notRun":[],"logFile":"review_20261022_144119.log"},"changedFiles":["src/test/e2e/signup.spec.ts"],"remainingIssues":["Gradle 테스트는 UP-TO-DATE 결과를 사용했다"],"nextStep":"signup.spec.ts 를 리뷰하고 커밋한다","precheckFile":"precheck_20261022_143852.html","inspectionLog":"inspection_20261022_143852.log"};
</script>
<script>
(function () {
  var PREPARE_LOGS = '../../../logs/prepare/'; // 이 페이지 기준 상대 경로
  var VERIFY_LOGS = '../../../logs/verify/';
  var view = document.getElementById('view');

  // 영역별 정의와 "해야 할 작업"의 기본 문구. 판정 기준은 팀이 정한 것이라 데이터가 아니라 템플릿에 고정한다.
  var ZONES = {
    GREEN: {
      name: 'Green',
      meaning: ['테스트가 충분하고, 구조가 잘 분리되어 있음', '코드 흐름을 파악하고 있고, 위험도가 낮은 영역'],
      todo: ['Inner Loop 를 믿고, Evidence 를 가볍게 살펴본다']
    },
    YELLOW: {
      name: 'Yellow',
      meaning: ['품질이 고르지 않은 느낌 (감각적으로 불안하거나 의심이 되는 곳)', '인지 부채가 생기는 곳 / 기존 테스트를 완전히 믿기 어려운 곳'],
      todo: ['Evidence 를 더 꼼꼼하게 살펴본다', 'Diff 요약을 리뷰한다', '테스트 보강을 제안한다']
    },
    RED: {
      name: 'Red',
      meaning: ['인증, 결제, 권한, 급여 등 민감한 영역', '도메인 지식이 필요한 곳'],
      todo: ['Inner Loop 의 모든 Step 을 꼼꼼히 리뷰한다']
    }
  };
  var LEVEL = { GREEN: 'GREEN', YELLOW: 'YELLOW', RED: 'RED' };

  // 데이터는 모두 textContent 로 넣는다(문자열을 HTML 로 해석하지 않는다).
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function badge(text, cls) { return el('span', 'badge ' + cls, text); }
  function card(num, title, extra) {
    var c = el('section', 'card' + (extra ? ' ' + extra : ''));
    var h = el('h2');
    if (num) h.appendChild(el('span', 'step', String(num)));
    h.appendChild(document.createTextNode(title));
    c.appendChild(h);
    return c;
  }
  function list(items) {
    var ul = el('ul');
    items.forEach(function (t) { ul.appendChild(el('li', null, t)); });
    return ul;
  }
  function label(parent, text) { parent.appendChild(el('div', 'label', text)); }
  function link(href, text) {
    var a = el('a', null, text);
    a.href = encodeURI(href);
    return a;
  }
  function evidence(text) {
    var d = el('details');
    d.appendChild(el('summary', null, '근거 보기'));
    d.appendChild(el('div', 'evidence', text || '(근거 없음)'));
    return d;
  }
  function resultTable(items, firstHeader) {
    var t = el('table');
    var thead = el('thead'), hr = el('tr');
    [firstHeader, '결과', ''].forEach(function (x) { hr.appendChild(el('th', null, x)); });
    thead.appendChild(hr); t.appendChild(thead);
    var tb = el('tbody');
    items.forEach(function (it) {
      var tr = el('tr');
      tr.appendChild(el('td', null, it.title || it.criterion || ''));
      var c2 = el('td'); c2.appendChild(badge(it.passed ? '통과' : '실패', it.passed ? 'yes' : 'no')); tr.appendChild(c2);
      var c3 = el('td'); c3.appendChild(evidence(it.evidence)); tr.appendChild(c3);
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    return t;
  }

  function render(r) {
    view.textContent = '';
    var tri = r.triage || {};
    var zone = ZONES[tri.zone] ? tri.zone : 'YELLOW';
    var def = ZONES[zone];
    document.title = '영역 판정 보고서 - ' + (r.createdAt || r.id || '');
    document.getElementById('sub').textContent =
      (r.loop ? '/' + r.loop + ' 의' : '루프의') + ' 결과를 Green · Yellow · Red 로 판정한 요약입니다. (' + (r.createdAt || r.id || '') + ')';

    // 1. 영역 판정 (맨 위)
    var zc = card(null, '영역 판정', 'zone ' + zone);
    var head = el('div', 'zone-head');
    head.appendChild(el('span', 'zone-dot ' + zone));
    head.appendChild(el('span', 'zone-name ' + zone, def.name));
    zc.appendChild(head);
    zc.appendChild(el('p', 'zone-summary', tri.summary || ''));

    label(zc, '이 영역의 기준');
    zc.appendChild(list(def.meaning));

    label(zc, '판정 이유');
    zc.appendChild(list(arr(tri.reasons)));

    if (arr(tri.signals).length) {
      label(zc, '판단에 쓴 신호');
      var st = el('table', 'signals');
      var sh = el('thead'), shr = el('tr');
      ['항목', '수준', '내용'].forEach(function (x) { shr.appendChild(el('th', null, x)); });
      sh.appendChild(shr); st.appendChild(sh);
      var sb = el('tbody');
      tri.signals.forEach(function (s) {
        var tr = el('tr');
        tr.appendChild(el('td', null, s.label || ''));
        var lv = LEVEL[s.level] ? s.level : 'YELLOW';
        var c = el('td'); c.appendChild(badge(ZONES[lv].name, lv)); tr.appendChild(c);
        tr.appendChild(el('td', null, s.note || ''));
        sb.appendChild(tr);
      });
      st.appendChild(sb);
      zc.appendChild(st);
    }

    label(zc, '해야 할 작업');
    var todo = el('div', 'todo ' + zone);
    todo.appendChild(list(def.todo.concat(arr(tri.actions))));
    zc.appendChild(todo);
    view.appendChild(zc);

    // 2. 테스트 결과
    var v = r.verify || {};
    var tc = card(2, '테스트 결과');
    if (arr(v.points).length) tc.appendChild(list(v.points));
    if (arr(v.checklist).length) {
      label(tc, '중요 체크리스트 3개');
      tc.appendChild(resultTable(v.checklist, '항목'));
    }
    if (arr(v.criteria).length) {
      label(tc, '수용 기준');
      tc.appendChild(resultTable(v.criteria, '기준'));
    }
    if (arr(v.regression).length) {
      label(tc, 'Regression Test (보유한 테스트 전체)');
      var t = el('table');
      var thead = el('thead'), hr = el('tr');
      [['테스트', ''], ['전체', 'n'], ['통과', 'n'], ['실패', 'n'], ['건너뜀', 'n']].forEach(function (h) {
        hr.appendChild(el('th', h[1], h[0]));
      });
      thead.appendChild(hr); t.appendChild(thead);
      var tb = el('tbody');
      v.regression.forEach(function (s) {
        var tr = el('tr');
        var c1 = el('td');
        c1.appendChild(el('div', null, s.name || ''));
        if (s.command) c1.appendChild(el('code', null, s.command));
        tr.appendChild(c1);
        [s.total, s.passed, s.failed, s.skipped].forEach(function (n) {
          tr.appendChild(el('td', 'n', n === undefined || n === null ? '-' : String(n)));
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      tc.appendChild(t);
    }
    if (arr(v.notRun).length) {
      label(tc, '실행하지 못한 검증');
      tc.appendChild(list(v.notRun));
    }
    if (arr(r.changedFiles).length) {
      label(tc, '변경한 파일 (' + r.changedFiles.length + '개)');
      var ul = el('ul');
      r.changedFiles.forEach(function (f) { var li = el('li'); li.appendChild(el('code', null, f)); ul.appendChild(li); });
      tc.appendChild(ul);
    }
    view.appendChild(tc);

    // 3. 결론
    var cc = card(3, '결론');
    var line = el('div');
    line.appendChild(badge(r.result || '?', r.result || ''));
    var rounds = r.round ? ' · ' + r.round + '번째 라운드' : '';
    line.appendChild(el('span', 'meta', '  ' + (r.createdAt || '') + rounds));
    cc.appendChild(line);
    cc.appendChild(el('p', 'headline', r.headline || ''));
    label(cc, '요청');
    cc.appendChild(el('div', 'req', r.request || ''));
    if (arr(r.remainingIssues).length) {
      label(cc, '남은 이슈');
      cc.appendChild(list(r.remainingIssues));
    }
    if (r.nextStep) {
      label(cc, '다음에 할 일');
      cc.appendChild(el('div', null, r.nextStep));
    }
    var links = el('div', 'links meta');
    if (r.precheckFile) links.appendChild(link(r.precheckFile, '점검 페이지'));
    if (r.inspectionLog) links.appendChild(link(PREPARE_LOGS + r.inspectionLog, '점검 로그'));
    if (v.logFile) links.appendChild(link(VERIFY_LOGS + v.logFile, '검증 로그'));
    if (links.childNodes.length) { label(cc, '자세히'); cc.appendChild(links); }
    view.appendChild(cc);
  }

  if (!report) {
    view.appendChild(el('p', 'none', '보고서 데이터가 없습니다. 이 파일은 템플릿입니다.'));
    return;
  }
  render(report);
})();
</script>
</body>
</html>
