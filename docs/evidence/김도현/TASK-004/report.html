<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영역 판정 보고서</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --text: #1f2937; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --accent-soft: #dbeafe;
    --ok: #15803d; --ok-soft: #dcfce7; --warn: #b45309; --warn-soft: #fef3c7;
    --bad: #b91c1c; --bad-soft: #fee2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827; --card: #1f2937; --text: #f3f4f6; --muted: #9ca3af; --line: #374151;
      --accent: #60a5fa; --accent-soft: #1e3a5f;
      --ok: #4ade80; --ok-soft: #14532d; --warn: #fbbf24; --warn-soft: #78350f;
      --bad: #f87171; --bad-soft: #7f1d1d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.6;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  header, main { max-width: 900px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 24px; }
  main { padding-bottom: 32px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .step { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex: none; }
  .badge { display: inline-block; padding: 3px 12px; border-radius: 999px; font-weight: 700; font-size: 13px; }
  .badge.PASS, .badge.yes, .badge.GREEN { background: var(--ok-soft); color: var(--ok); }
  .badge.no, .badge.FAIL, .badge.RED { background: var(--bad-soft); color: var(--bad); }
  .badge.warn, .badge.YELLOW { background: var(--warn-soft); color: var(--warn); }
  .meta { color: var(--muted); font-size: 13px; }
  .label { color: var(--muted); font-size: 12px; margin: 12px 0 2px; }
  ul { margin: 4px 0; padding-left: 20px; }
  li { margin-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td.n, th.n { text-align: right; white-space: nowrap; }
  code { font-family: Consolas, "D2Coding", monospace; font-size: 13px; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
  details { margin: 2px 0; }
  summary { cursor: pointer; color: var(--accent); font-size: 13px; }
  .evidence { white-space: pre-wrap; background: var(--bg); border-radius: 8px; padding: 8px 10px; margin-top: 4px; font-size: 13px; }
  .req { white-space: pre-wrap; background: var(--bg); border-radius: 8px; padding: 10px 12px; margin: 8px 0 0; }
  a { color: var(--accent); }
  .none { color: var(--muted); }
  .links a { margin-right: 14px; }

  /* 영역 판정 */
  .zone { border-width: 2px; }
  .zone.GREEN { border-color: var(--ok); }
  .zone.YELLOW { border-color: var(--warn); }
  .zone.RED { border-color: var(--bad); }
  .zone-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .zone-dot { width: 22px; height: 22px; border-radius: 50%; flex: none; }
  .zone-dot.GREEN { background: var(--ok); }
  .zone-dot.YELLOW { background: var(--warn); }
  .zone-dot.RED { background: var(--bad); }
  .zone-name { font-size: 20px; font-weight: 800; }
  .zone-name.GREEN { color: var(--ok); }
  .zone-name.YELLOW { color: var(--warn); }
  .zone-name.RED { color: var(--bad); }
  .zone-summary { font-size: 17px; font-weight: 700; margin: 10px 0 0; }
  .todo { border-radius: 8px; padding: 10px 12px; margin-top: 6px; }
  .todo.GREEN { background: var(--ok-soft); }
  .todo.YELLOW { background: var(--warn-soft); }
  .todo.RED { background: var(--bad-soft); }
  .todo ul { margin: 2px 0; }
  .signals td:first-child { white-space: nowrap; }
  .headline { font-size: 18px; font-weight: 700; margin: 8px 0 0; }
</style>
</head>
<body>
<header>
  <h1>영역 판정 보고서</h1>
  <p class="sub" id="sub">루프의 결과를 Green · Yellow · Red 로 판정한 요약입니다.</p>
</header>
<main id="view"></main>

<script>

var report = {"id": "TASK-004", "loop": "im", "round": 2, "createdAt": "2026-10-22 16:55", "request": "POST /api/orders 의 dueDays 를 정수만 받도록 엄격 검증(7.5, \"10\" 거부, 소수 입력 테스트 추가)하고, 납기를 넘는 경로 확정 시 '납기를 N일 초과합니다. 확정할까요?' 확인을 받는다.", "result": "PASS", "headline": "dueDays 비정수 입력은 400 으로 거부되고, 납기 초과 확정에는 확인창이 뜹니다. JUnit 30건·E2E 56건 모두 통과.", "changedFiles": ["src/main/java/com/example/demo/controller/OrderController.java", "src/main/resources/static/js/order-new.js", "src/test/java/com/example/demo/OrderFlowTests.java", "src/test/e2e/delivery-date.spec.ts", "docs/understand/김도현/prd_implement.md"], "remainingIssues": ["E2E 는 공유 DB 간섭으로 병렬 실행 시 일부 실패할 수 있어 --workers=1 로 실행했습니다(implement 자가검증 기록, 이번에는 병렬 미실행).", "dueDays 만 JsonNode 로 받아 검사하므로 다른 숫자 필드의 느슨한 변환은 그대로입니다."], "nextStep": "refactoring 단계로 진행합니다.", "precheckFile": "precheck.html", "triage": {"zone": "YELLOW", "summary": "주문 입력 검증과 확정 흐름 변경이며 금전·권한 영역은 아니지만, 입력 파싱 방식이 dueDays 에만 별도로 적용됩니다.", "reasons": ["인증·결제·권한·급여와 무관해 RED 는 아님", "요청 DTO 파싱 방식을 필드 하나만 JsonNode 로 바꿔 구조가 일관되지 않음(인지 부채)", "확인창은 window.confirm 이라 E2E 로만 검증됨"], "signals": [{"label": "테스트 충분성", "level": "GREEN", "note": "비정수 5종 JUnit, 확인창 수락·취소·미표시 E2E 추가. 기대값을 틀리게 바꾸면 실패함을 확인"}, {"label": "구조", "level": "YELLOW", "note": "dueDays 만 JsonNode 수동 검사. 전역 Jackson 엄격 설정이 아님"}, {"label": "도메인 민감도", "level": "GREEN", "note": "납기 입력 검증, 비용·소요일수 계산은 불변"}], "actions": ["dueDays 외 숫자 필드(orders 수량 등)도 엄격 검증이 필요한지 판단"]}, "verify": {"points": ["추가: src/test/java/.../OrderFlowTests.java dueDaysNonIntegerIsRejected (7.5, \"10\", 1e1, 10.0, true 모두 400 + 주문 수 불변)", "추가: src/test/e2e/delivery-date.spec.ts 확인창 수락·취소·미표시 3케이스(구현 단계에서 작성)", "변경: delivery-date.spec.ts 의 기존 확정 케이스에 확인창 수락 핸들러 추가(납기 초과 확인이 요구사항으로 생겨 기존 흐름이 대화상자를 만나기 때문)"], "checklist": [{"title": "POST /api/orders dueDays 7.5 → 400 + error, 주문 미생성", "passed": true, "evidence": "JUnit dueDaysNonIntegerIsRejected (7.5, 1e1, 10.0, true 포함) 통과, 주문 수 불변 단언"}, {"title": "dueDays \"10\"(문자열) → 400, 주문 미생성", "passed": true, "evidence": "같은 JUnit 케이스에 \"10\" 포함, 통과"}, {"title": "dueDays 5, 50, null·생략은 기존대로 200 저장", "passed": true, "evidence": "./gradlew test 기존 OrderFlowTests 통과"}, {"title": "범위 밖 4, 51 은 기존대로 400", "passed": true, "evidence": "./gradlew test 기존 OrderFlowTests 통과"}, {"title": "dueDays 유무가 계산을 바꾸지 않음", "passed": true, "evidence": "dueDaysDoesNotChangeServerCalculation 통과"}, {"title": "납기 초과 경로 확정 시 '납기를 N일 초과합니다. 확정할까요?' 확인창, N=소요일수-납기", "passed": true, "evidence": "E2E 수락 케이스에서 dialog 메시지가 `납기를 ${total-5}일 초과합니다. 확정할까요?` 와 일치"}, {"title": "확인창 취소 시 확정되지 않고 주문 추가 화면에 머문다", "passed": true, "evidence": "E2E 취소 케이스: 확인창 1회, URL /orders/new 유지, 확정 버튼 활성"}, {"title": "확인창 수락 시 확정되어 상세로 이동, 납기 초과 표시", "passed": true, "evidence": "E2E 수락 케이스 및 '납기 초과 주문 빨간 표시' 케이스 통과"}, {"title": "납기가 없거나 소요일수 ≤ 납기면 확인창 없이 확정", "passed": true, "evidence": "E2E: 납기 50·납기 없음에서 dialog 0회, 상세로 이동"}, {"title": "./gradlew test 전체와 delivery-date E2E 통과", "passed": true, "evidence": "JUnit 30건 통과, 전체 E2E 56건 통과(delivery-date 11건 포함)"}, {"title": "TASK-004 폴더에 precheck.html 과 report.html 공존", "passed": true, "evidence": "precheck.html 존재 확인, report.html 작성 후 확인"}], "criteria": [{"criterion": "정수가 아닌 dueDays 는 거부된다", "passed": true, "evidence": "JUnit 5종 400"}, {"criterion": "납기 초과 확정은 확인을 거친다", "passed": true, "evidence": "E2E 3케이스"}], "regression": [{"name": "Unit/Regression (JUnit)", "command": "./gradlew test --rerun-tasks", "total": 30, "passed": 30, "failed": 0, "skipped": 0}, {"name": "E2E 전체", "command": "BASE_URL=http://localhost:8081 npx playwright test --workers=1", "total": 56, "passed": 56, "failed": 0, "skipped": 0}, {"name": "E2E delivery-date", "command": "BASE_URL=http://localhost:8081 npx playwright test delivery-date --workers=1", "total": 11, "passed": 11, "failed": 0, "skipped": 0}], "notRun": ["E2E 병렬 워커 실행은 하지 않았습니다(공유 DB 간섭 가능성)."]}, "refactoring": {"summary":"코드는 수정하지 않고 변경 범위만 점검해 제안 3가지를 정리했습니다. 동작 결함이나 요구사항 위반은 찾지 못했습니다.","proposals":[{"title":"납기 입력 오류 문구·범위(5~50) 상수화","target":"src/main/resources/static/js/order-new.js, src/main/java/com/example/demo/controller/OrderController.java","description":"'납기일은 5일 이상 50일 이하의 정수로 입력하세요.' 문구가 order-new.js 두 곳(111, 207행)과 컨트롤러(134행)에 복사돼 있어 한 곳에서 정의해 재사용한다.","benefit":"범위나 문구가 바뀔 때 한 곳만 고치면 되고 화면·서버 메시지가 어긋나지 않는다.","risk":"동작 변화 없음, 범위 작음. 기존 JUnit·E2E의 문구 단언으로 보존 확인 가능."},{"title":"dueDays 정수 검사를 컨트롤러 밖 헬퍼로 분리","target":"src/main/java/com/example/demo/controller/OrderController.java","description":"confirm() 안의 JsonNode 검사·변환(129~137행)을 parseDueDays 같은 별도 메서드로 빼 요청 처리 본문을 짧게 하고, 검사 대상 필드가 늘 때 재사용할 수 있게 한다.","benefit":"confirm() 가독성이 좋아지고, dueDays 만 JsonNode 로 받는 구조의 일관성 부담(YELLOW)을 한 곳에 가둔다.","risk":"동작 변화 없음. dueDaysNonIntegerIsRejected(5종)와 기존 범위 테스트로 보존 확인 가능."},{"title":"E2E 확인창 핸들러 중복 정리","target":"src/test/e2e/delivery-date.spec.ts","description":"page.on('dialog') 수락·취소 핸들러가 여러 케이스(78, 94, 106, 158행)에 흩어져 있어 메시지 수집·수락·취소를 돕는 헬퍼로 모은다(일부는 추정).","benefit":"확인창 관련 케이스가 짧아지고 새 케이스 추가 시 핸들러 누락 실수가 줄어든다.","risk":"프로덕션 코드 영향 없음. 전체 E2E(delivery-date 11건)를 다시 돌려 확인해야 하며, 공유 DB 때문에 workers=1 필요."}],"checkedFiles":["src/main/java/com/example/demo/controller/OrderController.java","src/main/resources/static/js/order-new.js","src/test/java/com/example/demo/OrderFlowTests.java","src/test/e2e/delivery-date.spec.ts","docs/INTENT.md"]}};

<script>
(function () {
  var PREPARE_LOGS = '../../logs/prepare/'; // 이 페이지 기준 상대 경로
  var VERIFY_LOGS = '../../logs/verify/';
  var view = document.getElementById('view');

  // 영역별 정의와 "해야 할 작업"의 기본 문구. 판정 기준은 팀이 정한 것이라 데이터가 아니라 템플릿에 고정한다.
  var ZONES = {
    GREEN: {
      name: 'Green',
      meaning: ['테스트가 충분하고, 구조가 잘 분리되어 있음', '코드 흐름을 파악하고 있고, 위험도가 낮은 영역'],
      todo: ['Inner Loop 를 믿고, Evidence 를 가볍게 살펴본다']
    },
    YELLOW: {
      name: 'Yellow',
      meaning: ['품질이 고르지 않은 느낌 (감각적으로 불안하거나 의심이 되는 곳)', '인지 부채가 생기는 곳 / 기존 테스트를 완전히 믿기 어려운 곳'],
      todo: ['Evidence 를 더 꼼꼼하게 살펴본다', 'Diff 요약을 리뷰한다', '테스트 보강을 제안한다']
    },
    RED: {
      name: 'Red',
      meaning: ['인증, 결제, 권한, 급여 등 민감한 영역', '도메인 지식이 필요한 곳'],
      todo: ['Inner Loop 의 모든 Step 을 꼼꼼히 리뷰한다']
    }
  };
  var LEVEL = { GREEN: 'GREEN', YELLOW: 'YELLOW', RED: 'RED' };

  // 데이터는 모두 textContent 로 넣는다(문자열을 HTML 로 해석하지 않는다).
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function badge(text, cls) { return el('span', 'badge ' + cls, text); }
  function card(num, title, extra) {
    var c = el('section', 'card' + (extra ? ' ' + extra : ''));
    var h = el('h2');
    if (num) h.appendChild(el('span', 'step', String(num)));
    h.appendChild(document.createTextNode(title));
    c.appendChild(h);
    return c;
  }
  function list(items) {
    var ul = el('ul');
    items.forEach(function (t) { ul.appendChild(el('li', null, t)); });
    return ul;
  }
  function label(parent, text) { parent.appendChild(el('div', 'label', text)); }
  function link(href, text) {
    var a = el('a', null, text);
    a.href = encodeURI(href);
    return a;
  }
  function evidence(text) {
    var d = el('details');
    d.appendChild(el('summary', null, '근거 보기'));
    d.appendChild(el('div', 'evidence', text || '(근거 없음)'));
    return d;
  }
  function resultTable(items, firstHeader) {
    var t = el('table');
    var thead = el('thead'), hr = el('tr');
    [firstHeader, '결과', ''].forEach(function (x) { hr.appendChild(el('th', null, x)); });
    thead.appendChild(hr); t.appendChild(thead);
    var tb = el('tbody');
    items.forEach(function (it) {
      var tr = el('tr');
      tr.appendChild(el('td', null, it.title || it.criterion || ''));
      var c2 = el('td'); c2.appendChild(badge(it.passed ? '통과' : '실패', it.passed ? 'yes' : 'no')); tr.appendChild(c2);
      var c3 = el('td'); c3.appendChild(evidence(it.evidence)); tr.appendChild(c3);
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    return t;
  }

  function render(r) {
    view.textContent = '';
    var tri = r.triage || {};
    var zone = ZONES[tri.zone] ? tri.zone : 'YELLOW';
    var def = ZONES[zone];
    document.title = '영역 판정 보고서 - ' + (r.createdAt || r.id || '');
    document.getElementById('sub').textContent =
      (r.loop ? '/' + r.loop + ' 의' : '루프의') + ' 결과를 Green · Yellow · Red 로 판정한 요약입니다. (' + (r.createdAt || r.id || '') + ')';

    // 1. 영역 판정 (맨 위)
    var zc = card(null, '영역 판정', 'zone ' + zone);
    var head = el('div', 'zone-head');
    head.appendChild(el('span', 'zone-dot ' + zone));
    head.appendChild(el('span', 'zone-name ' + zone, def.name));
    zc.appendChild(head);
    zc.appendChild(el('p', 'zone-summary', tri.summary || ''));

    label(zc, '이 영역의 기준');
    zc.appendChild(list(def.meaning));

    label(zc, '판정 이유');
    zc.appendChild(list(arr(tri.reasons)));

    if (arr(tri.signals).length) {
      label(zc, '판단에 쓴 신호');
      var st = el('table', 'signals');
      var sh = el('thead'), shr = el('tr');
      ['항목', '수준', '내용'].forEach(function (x) { shr.appendChild(el('th', null, x)); });
      sh.appendChild(shr); st.appendChild(sh);
      var sb = el('tbody');
      tri.signals.forEach(function (s) {
        var tr = el('tr');
        tr.appendChild(el('td', null, s.label || ''));
        var lv = LEVEL[s.level] ? s.level : 'YELLOW';
        var c = el('td'); c.appendChild(badge(ZONES[lv].name, lv)); tr.appendChild(c);
        tr.appendChild(el('td', null, s.note || ''));
        sb.appendChild(tr);
      });
      st.appendChild(sb);
      zc.appendChild(st);
    }

    label(zc, '해야 할 작업');
    var todo = el('div', 'todo ' + zone);
    todo.appendChild(list(def.todo.concat(arr(tri.actions))));
    zc.appendChild(todo);
    view.appendChild(zc);

    // 2. 테스트 결과
    var v = r.verify || {};
    var tc = card(2, '테스트 결과');
    if (arr(v.points).length) tc.appendChild(list(v.points));
    if (arr(v.checklist).length) {
      label(tc, '중요 체크리스트 3개');
      tc.appendChild(resultTable(v.checklist, '항목'));
    }
    if (arr(v.criteria).length) {
      label(tc, '수용 기준');
      tc.appendChild(resultTable(v.criteria, '기준'));
    }
    if (arr(v.regression).length) {
      label(tc, 'Regression Test (보유한 테스트 전체)');
      var t = el('table');
      var thead = el('thead'), hr = el('tr');
      [['테스트', ''], ['전체', 'n'], ['통과', 'n'], ['실패', 'n'], ['건너뜀', 'n']].forEach(function (h) {
        hr.appendChild(el('th', h[1], h[0]));
      });
      thead.appendChild(hr); t.appendChild(thead);
      var tb = el('tbody');
      v.regression.forEach(function (s) {
        var tr = el('tr');
        var c1 = el('td');
        c1.appendChild(el('div', null, s.name || ''));
        if (s.command) c1.appendChild(el('code', null, s.command));
        tr.appendChild(c1);
        [s.total, s.passed, s.failed, s.skipped].forEach(function (n) {
          tr.appendChild(el('td', 'n', n === undefined || n === null ? '-' : String(n)));
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      tc.appendChild(t);
    }
    if (arr(v.notRun).length) {
      label(tc, '실행하지 못한 검증');
      tc.appendChild(list(v.notRun));
    }
    if (arr(r.changedFiles).length) {
      label(tc, '변경한 파일 (' + r.changedFiles.length + '개)');
      var ul = el('ul');
      r.changedFiles.forEach(function (f) { var li = el('li'); li.appendChild(el('code', null, f)); ul.appendChild(li); });
      tc.appendChild(ul);
    }
    view.appendChild(tc);

    // 3. 리팩토링 제안 (refactoring 단계가 report.refactoring 을 채웠을 때만 보인다. 코드는 수정하지 않은 제안이다)
    var rf = r.refactoring;
    var n = 3;
    if (rf && (arr(rf.proposals).length || rf.summary)) {
      n = 4;
      var rc = card(3, '리팩토링 제안 (코드 수정 없음)');
      if (rf.summary) rc.appendChild(el('p', null, rf.summary));
      if (arr(rf.proposals).length) {
        var pt = el('table');
        var ph = el('thead'), phr = el('tr');
        ['제안', '효과', '위험'].forEach(function (x) { phr.appendChild(el('th', null, x)); });
        ph.appendChild(phr); pt.appendChild(ph);
        var pb = el('tbody');
        rf.proposals.forEach(function (p) {
          var tr = el('tr');
          var c1 = el('td');
          c1.appendChild(el('div', null, p.title || ''));
          if (p.target) c1.appendChild(el('code', null, p.target));
          if (p.description) c1.appendChild(el('div', 'meta', p.description));
          tr.appendChild(c1);
          tr.appendChild(el('td', null, p.benefit || ''));
          tr.appendChild(el('td', null, p.risk || ''));
          pb.appendChild(tr);
        });
        pt.appendChild(pb);
        rc.appendChild(pt);
      }
      if (arr(rf.checkedFiles).length) {
        label(rc, '점검한 파일');
        var cl = el('ul');
        rf.checkedFiles.forEach(function (f) { var li = el('li'); li.appendChild(el('code', null, f)); cl.appendChild(li); });
        rc.appendChild(cl);
      }
      view.appendChild(rc);
    }

    // 결론
    var cc = card(n, '결론');
    var line = el('div');
    line.appendChild(badge(r.result || '?', r.result || ''));
    var rounds = r.round ? ' · ' + r.round + '번째 라운드' : '';
    line.appendChild(el('span', 'meta', '  ' + (r.createdAt || '') + rounds));
    cc.appendChild(line);
    cc.appendChild(el('p', 'headline', r.headline || ''));
    label(cc, '요청');
    cc.appendChild(el('div', 'req', r.request || ''));
    if (arr(r.remainingIssues).length) {
      label(cc, '남은 이슈');
      cc.appendChild(list(r.remainingIssues));
    }
    if (r.nextStep) {
      label(cc, '다음에 할 일');
      cc.appendChild(el('div', null, r.nextStep));
    }
    var links = el('div', 'links meta');
    if (r.precheckFile) links.appendChild(link(r.precheckFile, '점검 페이지'));
    if (r.inspectionLog) links.appendChild(link(PREPARE_LOGS + r.inspectionLog, '점검 로그'));
    if (v.logFile) links.appendChild(link(VERIFY_LOGS + v.logFile, '검증 로그'));
    if (links.childNodes.length) { label(cc, '자세히'); cc.appendChild(links); }
    view.appendChild(cc);
  }

  if (!report) {
    view.appendChild(el('p', 'none', '보고서 데이터가 없습니다. 이 파일은 템플릿입니다.'));
    return;
  }
  render(report);
})();
</script>
</body>
</html>
